[project]
name = "aml-monitoring-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NICK", email = "nicholaicorbie@yahoo.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13.24",
    "dagster-dbt>=0.10.9",
    "dagster-webserver>=1.13.24",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "evidently>=0.7.23",
    "fastapi[standard]>=0.141.1",
    "kaggle>=2.2.4",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "locust>=2.46.6",
    "lxml>=6.1.3",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pgvector>=0.5.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pymupdf4llm>=1.28.2",
    "pyspark>=4.2.0",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "sqlglot>=30.20.0",
]

[project.scripts]
aml-monitoring-platform = "aml_monitoring_platform:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
dl = [
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
]
