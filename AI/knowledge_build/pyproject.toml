[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epc-fetch"
version ="0.1.0"
description = "Concurrently fetch EPC records by postcode"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "python-dotenv>=0.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.4"
]

[project.scripts]
epc-fetch = "epc_fetch.cli:main"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]